<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FuÃŸball-App</title>
    <link rel="stylesheet" href="style.css">

    <!-- React und Babel aus dem Internet laden (nicht verÃ¤ndern) -->
    <script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.26.4/babel.min.js"></script>

    <!-- Gespeicherte Sport-Daten (erzeugt mit: node daten-aktualisieren.js) -->
    <script src="daten.js"></script>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel">

        const { useState, useEffect } = React;

        // Daten holen: zuerst aus daten.js (gespeichert), sonst aus dem Zwischenspeicher, sonst aus dem Internet.
        // So bleiben wir unter dem Limit der kostenlosen API (30 Anfragen pro Minute), auch mit der ganzen Klasse.
        function holeDaten(adresse) {
            if (window.GESPEICHERTE_DATEN && window.GESPEICHERTE_DATEN[adresse]) {
                return Promise.resolve(window.GESPEICHERTE_DATEN[adresse]);
            }
            try {
                const gespeichert = sessionStorage.getItem(adresse);
                if (gespeichert) return Promise.resolve(JSON.parse(gespeichert));
            } catch (e) { /* ohne Zwischenspeicher weiterarbeiten */ }
            return fetch(adresse)
                .then((antwort) => {
                    if (!antwort.ok) throw new Error("HTTP " + antwort.status);
                    return antwort.json();
                })
                .then((daten) => {
                    try { sessionStorage.setItem(adresse, JSON.stringify(daten)); } catch (e) { }
                    return daten;
                });
        }

        const LIGEN = [
            { name: "Bundesliga", code: "German_Bundesliga", id: 4331 },
            { name: "Premier League", code: "English_Premier_League", id: 4328 },
            { name: "La Liga", code: "Spanish_La_Liga", id: 4335 }
        ];

        // â­â­ TEIL 4 (fertig): die aktuelle Saison, z. B. "2026-2027" (eine Saison startet im Sommer)
        const heute = new Date();
        const startJahr = heute.getMonth() >= 6 ? heute.getFullYear() : heute.getFullYear() - 1;
        const SAISON = startJahr + "-" + (startJahr + 1);

        // â­â­ TEIL 4 (fertig): Form-Buchstaben als Emojis (W = Sieg, D = Unentschieden, L = Niederlage)
        const FORM_EMOJI = { W: "âœ…", D: "âž–", L: "âŒ" };

        // â­â­ TEIL 4 (fertig): Positionen auf Deutsch
        const POSITION_DEUTSCH = {
            "Goalkeeper": "Torwart",
            "Centre-Back": "Innenverteidiger",
            "Left-Back": "Linksverteidiger",
            "Right-Back": "Rechtsverteidiger",
            "Defender": "Verteidiger",
            "Defensive Midfield": "Defensives Mittelfeld",
            "Central Midfield": "Zentrales Mittelfeld",
            "Attacking Midfield": "Offensives Mittelfeld",
            "Midfielder": "Mittelfeld",
            "Left Wing": "LinksauÃŸen",
            "Right Wing": "RechtsauÃŸen",
            "Centre-Forward": "MittelstÃ¼rmer",
            "Forward": "StÃ¼rmer"
        };

        // Trainer, Manager usw. sind keine Spieler
        const KEIN_SPIELER = /manager|coach|ceo|chairman|president|director|owner|staff/i;


        // =====================================================
        // Eine Karte fÃ¼r EIN Team
        // =====================================================
        function TeamKarte({ team, onKlick }) {
            return (
                <div className="karte" onClick={onKlick}>

                    {/* âœ… HTML 2: Wappen (img) und Name (h2) */}
                    <img src={team.strBadge} alt={team.strTeam} />
                    <h2>{team.strTeam}</h2>
                </div>
            );
        }


        // =====================================================
        // â­â­ TEIL 4: Eine kleine Karte fÃ¼r EINEN Spieler
        // =====================================================
        function SpielerKarte({ spieler }) {

            // Fertig: Foto, Position, RÃ¼ckennummer und Alter
            const foto = spieler.strCutout || spieler.strThumb;
            const position = POSITION_DEUTSCH[spieler.strPosition] || spieler.strPosition;
            const nummer = spieler.strNumber || "â€“";
            const alter = spieler.dateBorn
                ? Math.floor((Date.now() - new Date(spieler.dateBorn)) / (365.25 * 24 * 60 * 60 * 1000))
                : "?";

            return (
                <div className="spieler-karte">
                    {/* âœï¸ DEIN HTML 15: Foto (img) mit src={foto}, RÃ¼ckennummer (span className="nummer"),
                                        Name (h4) und ein p mit Position und Alter */}

                </div>
            );
        }


        // =====================================================
        // Die Detail-Box, wenn man ein Team anklickt
        // =====================================================
        function Details({ team, onSchliessen }) {

            // Fertig: kurzer Text (deutsch oder englisch) und Webseite
            const text = team.strDescriptionDE || team.strDescriptionEN || "";
            const beschreibung = text.slice(0, 300) + " ...";
            const webseite = "https://" + team.strWebsite;

            // â­ ERWEITERUNG (fertig): mehr Infos und Links
            const spitznamen = team.strTeamAlternate || "keine";
            const wettbewerbe = [team.strLeague, team.strLeague2, team.strLeague3, team.strLeague4].filter(Boolean);
            const farben = [team.strColour1, team.strColour2, team.strColour3].filter(Boolean);
            const wikipedia = "https://de.wikipedia.org/wiki/Spezial:Suche?search=" + encodeURIComponent(team.strTeam);
            const links = [
                { name: "ðŸ“¸ Instagram", adresse: team.strInstagram },
                { name: "ðŸ‘ Facebook", adresse: team.strFacebook },
                { name: "ðŸ¦ X / Twitter", adresse: team.strTwitter },
                { name: "â–¶ï¸ YouTube", adresse: team.strYoutube }
            ]
                .filter((link) => link.adresse)
                .map((link) => ({ ...link, adresse: "https://" + link.adresse }));

            // â­ ERWEITERUNG (fertig): das letzte Spiel vom Team laden
            const [spiel, setSpiel] = useState(null);
            useEffect(() => {
                setSpiel(null);
                holeDaten("https://www.thesportsdb.com/api/v1/json/123/eventslast.php?id=" + team.idTeam)
                    .then((daten) => setSpiel(daten.results ? daten.results[0] : null));
            }, [team.idTeam]);

            return (
                <div className="details">
                    <button className="schliessen" onClick={onSchliessen}>âœ•</button>

                    {/* âœ… HTML 3: Name (h2), GegrÃ¼ndet, Stadion, Ort, Beschreibung, Link zur Webseite */}
                    <h2>{team.strTeam}</h2>
                    <p><strong>GegrÃ¼ndet:</strong> {team.intFormedYear}</p>
                    <p><strong>Stadion:</strong> {team.strStadium}</p>
                    <p><strong>Ort:</strong> {team.strLocation}</p>
                    <p>{beschreibung}</p>
                    <a href={webseite} target="_blank">Zur Webseite</a>

                    {/* ===================== â­ ERWEITERUNG ===================== */}
                    <div className="mehr-infos">

                        {team.strBanner && (
                            <>
                                {/* âœï¸ DEIN HTML 5: Banner-Bild (img className="banner") mit src={team.strBanner} */}

                            </>
                        )}

                        <div className="steckbrief">
                            {/* âœï¸ DEIN HTML 6: Ãœberschrift (h3) "ðŸ“‹ Steckbrief", ein p mit den Spitznamen
                                               und ein p "Wettbewerbe:" */}


                            <ul className="wettbewerbe">
                                {wettbewerbe.map((wettbewerb) => (
                                    <li key={wettbewerb}>
                                        {/* âœï¸ DEIN HTML 6: der Name vom Wettbewerb */}
                                    </li>
                                ))}
                            </ul>

                            {/* âœï¸ DEIN HTML 7: ein p "Vereinsfarben:" (die Farb-Punkte sind schon da) */}

                            <div className="farben">
                                {farben.map((farbe) => (
                                    <span key={farbe} className="farbe" style={{ backgroundColor: farbe }}></span>
                                ))}
                            </div>
                        </div>

                        {team.strEquipment && (
                            <div className="trikot-box">
                                {/* âœï¸ DEIN HTML 8: Ãœberschrift (h3) "ðŸ‘• Trikot" und das Bild (img className="trikot") */}

                            </div>
                        )}

                        {spiel && (
                            <div className="spiel">
                                {/* âœï¸ DEIN HTML 9a: Ãœberschrift (h3) "âš½ Letztes Spiel" und ein p mit dem Datum */}


                                <div className="spielstand">
                                    {/* âœï¸ DEIN HTML 9b: Heim-Wappen (img), Heim-Team (p),
                                                        Ergebnis (span className="tore"), Gast-Team (p), Gast-Wappen (img) */}


                                </div>
                            </div>
                        )}

                        <div className="link-leiste">
                            {links.map((link) => (
                                <a key={link.name} className="link-button" href={link.adresse} target="_blank">
                                    {/* âœï¸ DEIN HTML 10: der Name vom Link */}
                                </a>
                            ))}

                            {/* âœï¸ DEIN HTML 10: noch ein Link (a className="link-button") zu Wikipedia */}

                        </div>
                    </div>

                    {/* ===================== â­â­ TEIL 4 ===================== */}
                    {kader.length > 0 && (
                        <div className="kader">
                            {/* âœï¸ DEIN HTML 14: Ãœberschrift (h3) "ðŸ‘¥ Spieler" */}


                            <div className="spieler-liste">
                                {kader.map((spieler) => (
                                    <SpielerKarte key={spieler.idPlayer} spieler={spieler} />
                                ))}
                            </div>
                        </div>
                    )}
                </div>
            );
        }


        // =====================================================
        // Die App (JavaScript ist fertig)
        // =====================================================
        function App() {
            const [liga, setLiga] = useState("German_Bundesliga");
            const [teams, setTeams] = useState([]);
            const [laedt, setLaedt] = useState(true);
            const [ausgewaehlt, setAusgewaehlt] = useState(null);

            useEffect(() => {
                setLaedt(true);
                setAusgewaehlt(null);
                holeDaten("https://www.thesportsdb.com/api/v1/json/123/search_all_teams.php?l=" + liga)
                    .then((daten) => {
                        setTeams(daten.teams || []);
                        setLaedt(false);
                    });
            }, [liga]);

            // â­â­ TEIL 4 (fertig): die Tabelle der Liga laden (der kostenlose Zugang liefert die Top 5)
            const [tabelle, setTabelle] = useState([]);
            useEffect(() => {
                setTabelle([]);
                const ligaId = LIGEN.find((l) => l.code === liga).id;
                holeDaten("https://www.thesportsdb.com/api/v1/json/123/lookuptable.php?l=" + ligaId + "&s=" + SAISON)
                    .then((daten) => setTabelle(daten.table || []))
                    .catch(() => setTabelle([]));
            }, [liga]);

            // â­â­ TEIL 4 (fertig): Klick auf eine Zeile in der Tabelle Ã¶ffnet das Team
            function zeileAnklicken(zeile) {
                const team = teams.find((t) => t.idTeam === zeile.idTeam);
                if (team) setAusgewaehlt(team);
            }

            return (
                <div className="seite">

                    <header>
                        {/* âœ… HTML 1: Ãœberschrift (h1) und Untertitel (p className="untertitel") */}
                        <h1>âš½ FuÃŸball-App</h1>
                        <p className="untertitel">Die besten Teams aus Europa</p>
                    </header>

                    <nav className="liga-leiste">
                        {LIGEN.map((l) => (
                            <button
                                key={l.code}
                                className={l.code === liga ? "liga-button aktiv" : "liga-button"}
                                onClick={() => setLiga(l.code)}
                            >
                                {l.name}
                            </button>
                        ))}
                    </nav>

                    {/* ===================== â­â­ TEIL 4: Tabelle ===================== */}
                    {tabelle.length > 0 && (
                        <section className="tabelle-box">
                            {/* âœï¸ DEIN HTML 11: Ãœberschrift (h2) "ðŸ† Tabelle" und ein p (className="saison")
                                                mit "Saison {SAISON} Â· Top 5" */}


                            <table className="tabelle">
                                <thead>
                                    <tr>
                                        {/* âœï¸ DEIN HTML 12: sechs Spalten-Ãœberschriften (th):
                                                            Platz, Team, Spiele, Tordiff., Punkte, Form */}

                                    </tr>
                                </thead>
                                <tbody>
                                    {tabelle.map((zeile) => {
                                        // Fertig: die Form als Emojis, z. B. "âœ… âœ… âž– âœ… âŒ"
                                        const form = (zeile.strForm || "").split("").map((b) => FORM_EMOJI[b] || "").join(" ");
                                        const markiert = ausgewaehlt && ausgewaehlt.idTeam === zeile.idTeam;

                                        return (
                                            <tr key={zeile.idTeam} className={markiert ? "markiert" : ""} onClick={() => zeileAnklicken(zeile)}>
                                                {/* âœï¸ DEIN HTML 13: sechs Zellen (td):
                                                                    {zeile.intRank}
                                                                    Wappen und Name: <td className="team-zelle"><img src={zeile.strBadge} alt="" /> {zeile.strTeam}</td>
                                                                    {zeile.intPlayed}
                                                                    {zeile.intGoalDifference}
                                                                    {zeile.intPoints} (in strong)
                                                                    {form} */}

                                            </tr>
                                        );
                                    })}
                                </tbody>
                            </table>
                        </section>
                    )}

                    {laedt ? (
                        <p className="laden">LÃ¤dt ... âš½</p>
                    ) : (
                        <div className="karten">
                            {teams.map((team) => (
                                <TeamKarte key={team.idTeam} team={team} onKlick={() => setAusgewaehlt(team)} />
                            ))}
                        </div>
                    )}

                    {ausgewaehlt && (
                        <Details team={ausgewaehlt} onSchliessen={() => setAusgewaehlt(null)} />
                    )}

                    <footer>
                        {/* âœ… HTML 4: "Gemacht von DEIN NAME" */}
                        <p>Gemacht von Leon, Denijel und Tom</p>
                    </footer>

                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById("root")).render(<App />);

    </script>
</body>
</html>
