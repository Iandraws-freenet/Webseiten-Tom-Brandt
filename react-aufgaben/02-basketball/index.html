<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basketball-App</title>
    <link rel="stylesheet" href="style.css">

    <!-- React und Babel aus dem Internet laden (nicht verändern) -->
    <script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.26.4/babel.min.js"></script>

    <!-- Gespeicherte Sport-Daten (erzeugt mit: node daten-aktualisieren.js) -->
    <script src="daten.js"></script>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel">

        const { useState, useEffect } = React;

        // Daten holen: zuerst aus daten.js (gespeichert), sonst aus dem Zwischenspeicher, sonst aus dem Internet.
        // So bleiben wir unter dem Limit der kostenlosen API (30 Anfragen pro Minute), auch mit der ganzen Klasse.
        function holeDaten(adresse) {
            if (window.GESPEICHERTE_DATEN && window.GESPEICHERTE_DATEN[adresse]) {
                return Promise.resolve(window.GESPEICHERTE_DATEN[adresse]);
            }
            try {
                const gespeichert = sessionStorage.getItem(adresse);
                if (gespeichert) return Promise.resolve(JSON.parse(gespeichert));
            } catch (e) { /* ohne Zwischenspeicher weiterarbeiten */ }
            return fetch(adresse)
                .then((antwort) => {
                    if (!antwort.ok) throw new Error("HTTP " + antwort.status);
                    return antwort.json();
                })
                .then((daten) => {
                    try { sessionStorage.setItem(adresse, JSON.stringify(daten)); } catch (e) { }
                    return daten;
                });
        }

        const API_URL = "https://www.thesportsdb.com/api/v1/json/123/search_all_teams.php?l=NBA";
        const SPURS_API_URL = "https://www.thesportsdb.com/api/v1/json/123/searchteams.php?t=San%20Antonio%20Spurs";

        const SORTIERUNGEN = [
            { name: "A–Z", wert: "name" },
            { name: "Älteste zuerst", wert: "alt" },
            { name: "Neueste zuerst", wert: "neu" }
        ];


        // =====================================================
        // Eine Karte für EIN Team
        // =====================================================
        function TeamKarte({ team, istFavorit, onFavorit }) {
            return (
                <div className={istFavorit ? "karte favorit" : "karte"}>

                    <img src={team.strBadge} alt={team.strTeam} />
                    <h2>{team.strTeam}</h2>
                    <span className="kurz">{team.strTeamShort}</span>
                    <p>Seit {team.intFormedYear}</p>
                    <p>{team.strStadium}</p>

                    <button className="herz" onClick={onFavorit}>
                        {istFavorit ? "❤️" : "🤍"}
                    </button>
                </div>
            );
        }


        // =====================================================
        // Die App (JavaScript ist fertig)
        // =====================================================
        function App() {
            const [teams, setTeams] = useState([]);
            const [suche, setSuche] = useState("");
            const [sortierung, setSortierung] = useState("name");
            const [favoriten, setFavoriten] = useState([]);
            const [laedt, setLaedt] = useState(true);
            const [ladeFehler, setLadeFehler] = useState("");

            useEffect(() => {
                setLaedt(true);
                setLadeFehler("");
                Promise.all([API_URL, SPURS_API_URL].map((url) =>
                    holeDaten(url)
                ))
                    .then(([nbaDaten, spursDaten]) => {
                        const alleTeams = nbaDaten.teams || [];
                        (spursDaten.teams || []).forEach((team) => {
                            if (!alleTeams.some((nbaTeam) => nbaTeam.idTeam === team.idTeam)) {
                                alleTeams.push(team);
                            }
                        });
                        setTeams(alleTeams);
                    })
                    .catch((fehler) => {
                        console.error("NBA-Teams konnten nicht geladen werden:", fehler);
                        const details = fehler instanceof Error ? ` (${fehler.message})` : "";
                        setLadeFehler(`Die Teams konnten nicht geladen werden${details}. Bitte versuche es später erneut.`);
                    })
                    .finally(() => setLaedt(false));
            }, []);

            function favoritUmschalten(id) {
                if (favoriten.includes(id)) {
                    setFavoriten(favoriten.filter((f) => f !== id));
                } else {
                    setFavoriten([...favoriten, id]);
                }
            }

            const gefilterteTeams = teams
                .filter((team) => team.strTeam.toLowerCase().includes(suche.toLowerCase()))
                .sort((a, b) => {
                    if (sortierung === "alt") return a.intFormedYear - b.intFormedYear;
                    if (sortierung === "neu") return b.intFormedYear - a.intFormedYear;
                    return a.strTeam.localeCompare(b.strTeam);
                });

            const anzahlTeams = gefilterteTeams.length;
            const anzahlFavoriten = favoriten.length;

            return (
                <div className="seite">

                    <header>
                        <h1>🏀 NBA-Teams</h1>
                        <p className="untertitel">Go Spurs Go! Finde dein Lieblings-Team!</p>
                    </header>

                    <input
                        className="suche"
                        placeholder="Team suchen ..."
                        value={suche}
                        onChange={(e) => setSuche(e.target.value)}
                    />

                    <div className="sortier-leiste">
                        {SORTIERUNGEN.map((s) => (
                            <button
                                key={s.wert}
                                className={s.wert === sortierung ? "sortier-button aktiv" : "sortier-button"}
                                onClick={() => setSortierung(s.wert)}
                            >
                                {s.name}
                            </button>
                        ))}
                    </div>

                    <p className="zaehler">
                        {anzahlTeams} Teams · {anzahlFavoriten} Favoriten ❤️
                    </p>

                    {laedt ? (
                        <p role="status">NBA-Teams werden geladen ...</p>
                    ) : ladeFehler ? (
                        <p role="alert">{ladeFehler}</p>
                    ) : gefilterteTeams.length > 0 ? (
                        <div className="karten">
                            {gefilterteTeams.map((team) => (
                                <TeamKarte
                                    key={team.idTeam}
                                    team={team}
                                    istFavorit={favoriten.includes(team.idTeam)}
                                    onFavorit={() => favoritUmschalten(team.idTeam)}
                                />
                            ))}
                        </div>
                    ) : (
                        <div className="nichts-gefunden">
                            <p className="emoji">😢</p>
                            <p>Kein Team gefunden</p>
                        </div>
                    )}

                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById("root")).render(<App />);

    </script>
</body>
</html>
