<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basketball-App</title>
    <link rel="stylesheet" href="style.css">

    <!-- React und Babel aus dem Internet laden (nicht verändern) -->
    <script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.26.4/babel.min.js"></script>

    <!-- Gespeicherte Sport-Daten (erzeugt mit: node daten-aktualisieren.js) -->
    <script src="daten.js"></script>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel">

        const { useState, useEffect } = React;

        const API_URL = "https://www.thesportsdb.com/api/v1/json/123/search_all_teams.php?l=NBA";
        const SPURS_URL = "https://www.thesportsdb.com/api/v1/json/123/searchteams.php?t=San_Antonio_Spurs";

        const SORTIERUNGEN = [
            { name: "A–Z", wert: "name" },
            { name: "Älteste zuerst", wert: "alt" },
            { name: "Neueste zuerst", wert: "neu" }
        ];


        // =====================================================
        // Eine Karte für EIN Team
        // =====================================================
        function TeamKarte({ team, istFavorit, onFavorit, onKlick, imVergleich, onVergleich }) {
            let klassen = "karte";
            if (istFavorit) klassen = klassen + " favorit";
            if (imVergleich) klassen = klassen + " im-vergleich";   // ⭐⭐ Teil 4

            return (
                <div className={klassen} onClick={onKlick}>

                    {/* ⭐⭐ Teil 4: Vergleichs-Knopf (fertig) */}
                    <button
                        className="vergleich-button"
                        title="Team vergleichen"
                        onClick={(e) => {
                            e.stopPropagation();   // Vergleichs-Klick öffnet NICHT die Details
                            onVergleich();
                        }}
                    >
                        ⚔️
                    </button>

                    {/* ✅ HTML 3: Logo (img), Name (h2), Abkürzung (span className="kurz"),
                                   Gründungsjahr (p) und Halle (p) */}
                    <img src={team.strBadge} alt={team.strTeam} />
                    <h2>{team.strTeam}</h2>
                    <span className="kurz">{team.strTeamShort}</span>
                    <p>seit {team.intFormedYear}</p>
                    <p>{team.strStadium}</p>
                    <button
                        className="herz"
                        onClick={(e) => {
                            e.stopPropagation();   // Herz-Klick öffnet NICHT die Details
                            onFavorit();
                        }}
                    >
                        {istFavorit ? "❤️" : "🤍"}
                    </button>
                </div>
            );
        }


        // =====================================================
        // ⭐ ERWEITERUNG: Die Detail-Box, wenn man ein Team anklickt
        // =====================================================
        function Details({ team, onSchliessen }) {

            // Fertig: Text, Webseite, Links
            const text = team.strDescriptionDE || team.strDescriptionEN || "";
            const beschreibung = text.slice(0, 350) + " ...";
            const webseite = "https://" + team.strWebsite;
            const wikipedia = "https://de.wikipedia.org/wiki/Spezial:Suche?search=" + encodeURIComponent(team.strTeam);
            const farben = [team.strColour1, team.strColour2, team.strColour3].filter(Boolean);
            const links = [
                { name: "📸 Instagram", adresse: team.strInstagram },
                { name: "👍 Facebook", adresse: team.strFacebook },
                { name: "🐦 X / Twitter", adresse: team.strTwitter },
                { name: "▶️ YouTube", adresse: team.strYoutube }
            ]
                .filter((link) => link.adresse)
                .map((link) => ({ ...link, adresse: "https://" + link.adresse }));

            // Fertig: das letzte Spiel vom Team laden
            const [spiel, setSpiel] = useState(null);
            useEffect(() => {
                setSpiel(null);
                fetch("https://www.thesportsdb.com/api/v1/json/123/eventslast.php?id=" + team.idTeam)
                    .then((antwort) => antwort.json())
                    .then((daten) => setSpiel(daten.results ? daten.results[0] : null));
            }, [team.idTeam]);

            return (
                <div className="overlay" onClick={onSchliessen}>
                    <div className="details" style={{ backgroundColor: team.strColour1 }}  onClick={(e) => e.stopPropagation()}>
                        <button className="schliessen" onClick={onSchliessen}>✕</button>

                        {team.strBanner && (
                            <>
                                {/* ✏️ DEIN HTML 5: Banner-Bild (img className="banner") mit src={team.strBanner} */}
                                <img className="banner" src={team.strBanner} alt={"Banner"} />
                            </>
                        )}
                            <div className="esttaetischeBox">
                        {/* ✏️ DEIN HTML 6: Name (h2), Ort, Halle, Gegründet (je ein p mit strong)
                                           und die Beschreibung (p className="beschreibung") */}
                            <h2>{team.strTeam}</h2>
                            
                            <p className="Klassendetails"><strong>Halle:</strong> {team.strStadiumLocation}</p>

                            <p className="Klassendetails"><strong>Gegründet:</strong> {team.intFormedYear}</p>
                            <p className="beschreibung">{beschreibung}</p>

                        {/* ✏️ DEIN HTML 7: ein p "Team-Farben:" (die Farb-Punkte sind schon da) */}

                        <div className="farben">
                            {farben.map((farbe) => (
                                <span key={farbe} className="farbe" style={{ backgroundColor: farbe }}></span>
                            ))}
                        </div>

                        {spiel && (
                            <div className="spiel">
                                {/* ✏️ DEIN HTML 8a: Überschrift (h3) "🏀 Letztes Spiel" und ein p mit dem Datum */}
                                <h3 className="Klassendetails">🏀 Letztes Spiel</h3> <p className="Klassendetails">{spiel.dateEvent}</p>

                                <div className="spielstand">
                                    {/* ✏️ DEIN HTML 8b: Heim-Logo (img), Heim-Team (p),
                                                        Ergebnis (span className="punkte"), Gast-Team (p), Gast-Logo (img) */}
                                       <img src={spiel.strHomeTeamBadge} alt={spiel.strHomeTeam} />
                                    <span className="punkte Klassendetails">{spiel.intHomeScore} : {spiel.intAwayScore}</span>
                                    <img src={spiel.strAwayTeamBadge} alt={spiel.strAwayTeam} />

                                                        
                                    
                                </div>
                            </div>
                        )}

                        <div className="link-leiste">
                            {/* ✏️ DEIN HTML 9: Link zur Webseite (a className="link-button") mit {webseite} */}
                            <a className="link-button" href={webseite} target="_blank">{webseite}</a>
                            

                            

                            {/* ✏️ DEIN HTML 9: Link zu Wikipedia (a className="link-button") mit {wikipedia} */}
                                <a className="link-button" href={wikipedia} target="_blank">Wikipedia Information</a>
                              </div> 
                        </div>
                    </div>
                </div>
            );
        }


        // =====================================================
        // ⭐⭐ TEIL 4: Zwei Teams im Vergleich
        // =====================================================
        function Vergleich({ teams, onLeeren }) {
            const [links, rechts] = teams;

            // Fertig: die Box rollt ins Bild, sobald zwei Teams ausgewählt sind
            const box = useRef(null);
            useEffect(() => {
                box.current.scrollIntoView({ behavior: "smooth", block: "center" });
            }, [links.idTeam, rechts.idTeam]);

            // Fertig: Werte ausrechnen
            function plaetze(team) {
                return Number(team.intStadiumCapacity) || 0;
            }
            function kanaele(team) {
                return [team.strInstagram, team.strFacebook, team.strTwitter, team.strYoutube].filter(Boolean).length;
            }
            function wer(wertLinks, wertRechts, kleinerGewinnt) {
                if (!wertLinks || !wertRechts || wertLinks === wertRechts) return "";
                const linksBesser = kleinerGewinnt ? wertLinks < wertRechts : wertLinks > wertRechts;
                return linksBesser ? "links" : "rechts";
            }

            // Fertig: die Zeilen vom Vergleich
            const zeilen = [
                {
                    titel: "📅 Gegründet",
                    links: links.intFormedYear,
                    rechts: rechts.intFormedYear,
                    sieger: wer(Number(links.intFormedYear), Number(rechts.intFormedYear), true)   // älter gewinnt
                },
                {
                    titel: "🏟️ Plätze in der Halle",
                    links: plaetze(links) ? plaetze(links).toLocaleString("de-DE") : "?",
                    rechts: plaetze(rechts) ? plaetze(rechts).toLocaleString("de-DE") : "?",
                    sieger: wer(plaetze(links), plaetze(rechts), false)   // mehr gewinnt
                },
                {
                    titel: "📱 Social-Media-Kanäle",
                    links: kanaele(links),
                    rechts: kanaele(rechts),
                    sieger: wer(kanaele(links), kanaele(rechts), false)   // mehr gewinnt
                }
            ];

            const punkteLinks = zeilen.filter((z) => z.sieger === "links").length;
            const punkteRechts = zeilen.filter((z) => z.sieger === "rechts").length;
            let ergebnis = "🤝 Unentschieden!";
            if (punkteLinks > punkteRechts) ergebnis = "🏆 " + links.strTeam + " gewinnt den Vergleich!";
            if (punkteRechts > punkteLinks) ergebnis = "🏆 " + rechts.strTeam + " gewinnt den Vergleich!";

            return (
                <section className="vergleich" ref={box}>
                    <button className="leeren" title="Vergleich schließen" onClick={onLeeren}>✕</button>

                    {/* ✏️ DEIN HTML 11: Überschrift (h2) "⚔️ Team-Vergleich" */}


                    <div className="vergleich-kopf">
                        <div className="vergleich-team">
                            {/* ✏️ DEIN HTML 12: Logo (img) und Name (h3) vom linken Team:
                                                {links.strBadge} und {links.strTeam} */}

                        </div>

                        <span className="vs">VS</span>

                        <div className="vergleich-team">
                            {/* ✏️ DEIN HTML 12: dasselbe für das rechte Team:
                                                {rechts.strBadge} und {rechts.strTeam} */}

                        </div>
                    </div>

                    {zeilen.map((zeile) => (
                        <div key={zeile.titel} className="vergleich-zeile">
                            <span className={zeile.sieger === "links" ? "wert gewinner" : "wert"}>
                                {/* ✏️ DEIN HTML 13: der Wert vom linken Team {zeile.links} */}
                            </span>
                            <span className="titel">
                                {/* ✏️ DEIN HTML 13: der Titel {zeile.titel} */}
                            </span>
                            <span className={zeile.sieger === "rechts" ? "wert gewinner" : "wert"}>
                                {/* ✏️ DEIN HTML 13: der Wert vom rechten Team {zeile.rechts} */}
                            </span>
                        </div>
                    ))}

                    {/* ✏️ DEIN HTML 14: das Ergebnis in einem div (className="ergebnis"):
                                        ein p mit {punkteLinks} : {punkteRechts} und ein p mit {ergebnis} */}

                </section>
            );
        }


        // =====================================================
        // Die App (JavaScript ist fertig)
        // =====================================================
        function App() {
            const [teams, setTeams] = useState([]);
            const [suche, setSuche] = useState("");
            const [sortierung, setSortierung] = useState("name");
            const [favoriten, setFavoriten] = useState([]);
            const [laedt, setLaedt] = useState(true);
            const [ladeFehler, setLadeFehler] = useState("");

            const [ausgewaehlt, setAusgewaehlt] = useState(null);   // ⭐ angeklicktes Team
            const [vergleich, setVergleich] = useState([]);          // ⭐⭐ Teams im Vergleich (höchstens 2)

            useEffect(() => {
                // Der kostenlose Zugang liefert nur 10 Teams. Die Spurs laden wir extra dazu!
                Promise.all([
                    fetch(API_URL).then((antwort) => antwort.json()),
                    fetch(SPURS_URL).then((antwort) => antwort.json())
                ]).then(([daten, spurs]) => {
                    const alle = [...(daten.teams || []), ...(spurs.teams || [])];
                    const ohneDoppelte = alle.filter((team, i) => alle.findIndex((t) => t.idTeam === team.idTeam) === i);
                    setTeams(ohneDoppelte.filter((team) => team.strSport === "Basketball"));
                });
            }, []);

            // ⭐⭐ TEIL 4 (fertig): Team in den Vergleich legen oder wieder rausnehmen
            function vergleichUmschalten(team) {
                if (vergleich.some((t) => t.idTeam === team.idTeam)) {
                    setVergleich(vergleich.filter((t) => t.idTeam !== team.idTeam));
                } else if (vergleich.length < 2) {
                    setVergleich([...vergleich, team]);
                } else {
                    setVergleich([vergleich[1], team]);   // schon 2 da? Das erste fliegt raus
                }
            }

            function favoritUmschalten(id) {
                if (favoriten.includes(id)) {
                    setFavoriten(favoriten.filter((f) => f !== id));
                } else {
                    setFavoriten([...favoriten, id]);
                }
            }

            const gefilterteTeams = teams
                .filter((team) => team.strTeam.toLowerCase().includes(suche.toLowerCase()))
                .sort((a, b) => {
                    if (sortierung === "alt") return a.intFormedYear - b.intFormedYear;
                    if (sortierung === "neu") return b.intFormedYear - a.intFormedYear;
                    return a.strTeam.localeCompare(b.strTeam);
                });

            const anzahlTeams = gefilterteTeams.length;
            const anzahlFavoriten = favoriten.length;

            return (
                <div className="seite">

                    <header>
                        {/* ✅ HTML 1: Überschrift (h1) und Untertitel (p className="untertitel") */}
                        <h1>🏀 NBA-Teams</h1>
                        <p className="untertitel">Go Spurs Go! Finde dein Lieblings-Team!</p>
                    </header>

                    <input
                        className="suche"
                        placeholder="Team suchen ..."
                        value={suche}
                        onChange={(e) => setSuche(e.target.value)}
                    />

                    <div className="sortier-leiste">
                        {SORTIERUNGEN.map((s) => (
                            <button
                                key={s.wert}
                                className={s.wert === sortierung ? "sortier-button aktiv" : "sortier-button"}
                                onClick={() => setSortierung(s.wert)}
                            >
                                {s.name}
                            </button>
                        ))}
                    </div>

                    {/* ✅ HTML 2: Zähler (p className="zaehler") */}
                    <p className="zaehler">{anzahlTeams} Teams · {anzahlFavoriten} Favoriten ❤️</p>

                    {/* ===================== ⭐⭐ TEIL 4: Vergleich ===================== */}
                    {vergleich.length === 1 && (
                        <div className="vergleich-hinweis">
                            {/* ✏️ DEIN HTML 10: ein p mit "👉 Wähle noch ein Team zum Vergleichen (⚔️)" */}

                        </div>
                    )}

                    {vergleich.length === 2 && (
                        <Vergleich teams={vergleich} onLeeren={() => setVergleich([])} />
                    )}

                    <div className="karten">
                        {gefilterteTeams.map((team) => (
                            <TeamKarte
                                key={team.idTeam}
                                team={team}
                                istFavorit={favoriten.includes(team.idTeam)}
                                onFavorit={() => favoritUmschalten(team.idTeam)}
                                onKlick={() => setAusgewaehlt(team)}
                                imVergleich={vergleich.some((t) => t.idTeam === team.idTeam)}
                                onVergleich={() => vergleichUmschalten(team)}
                            />
                        ))}
                    </div>

                    {ausgewaehlt && (
                        <Details team={ausgewaehlt} onSchliessen={() => setAusgewaehlt(null)} />
                    )}

                    {teams.length > 0 && anzahlTeams === 0 && (
                        <div className="nichts-gefunden">

                            {/* ✅ HTML 4: ein großes Emoji und der Text "Kein Team gefunden" */}
                            <p className="emoji">😢</p>
                            <p>Kein Team gefunden</p>
                        </div>
                    )}

                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById("root")).render(<App />);

    </script>
</body>
</html>
